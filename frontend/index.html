<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Business Analyst</title>
    <meta name="description" content="Upload your data, get instant KPIs, forecasts, and AI-verified answers." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Applied synchronously (before paint) to avoid a flash of the wrong
      // theme. Mirrors the logic in src/context/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('aba_theme');
          var isDark = stored === 'dark' || (stored !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
