services:
  - type: web
    name: ai-business-analyst-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        value: alerts@yourdomain.com
      - key: FRONTEND_ORIGINS
        value: https://your-app.vercel.app
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: ENABLE_SCHEDULER
        value: "true"
